interface:
  display_name: "IELTS Speaking Coach"
  short_description: "Practise IELTS, improve wording, replay answers, and save compact reports"
  default_prompt: "Use $ielts-speaking-coach to start today's IELTS speaking practice in English with my local topic bank. Correct me briefly with precise error labels and natural Band 7 wording. Record Chinese-to-English language gaps and evidence-supported recurring vocabulary errors. When I summarize, stop questioning, give a short recap, and offer the three-pass review: full answers about 1.2x, short thought groups about 0.8x with gaps, and whole sentences at normal pace. Do not wait for or grade shadowing; stop on an explicit stop request. After review or skip, save a compact A4 Word report and the weekly listening TXT. Do not promise precise audio controls."
